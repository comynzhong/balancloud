<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#00A870">
  <link rel="icon" href="/favicon.svg">
  <title>衡电云控 BALANCLOUD</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    body {
      background: #edf7f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* 首次进入的启动页：只做品牌露出，路由就绪后淡出（收起逻辑在 src/main.js） */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 640px at 50% -12%, #ffffff 0%, #f1faf5 44%, #e4f3ea 100%);
      transition: opacity 0.42s ease, visibility 0.42s ease;
    }

    #splash.is-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: splash-rise 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    .splash-mark {
      width: 64px;
      height: 64px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 14px 30px rgba(0, 120, 82, 0.16), 0 2px 6px rgba(0, 120, 82, 0.08);
    }

    .splash-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.14em;
      margin-left: 0.14em;
      color: #14342a;
    }

    .splash-en {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.34em;
      margin-top: -8px;
      margin-left: 0.34em;
      color: #5c8a78;
    }

    .splash-bar {
      width: 132px;
      height: 3px;
      margin-top: 4px;
      border-radius: 999px;
      background: rgba(0, 168, 112, 0.16);
      overflow: hidden;
    }

    .splash-bar i {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00a870, #35d39b);
      animation: splash-run 1.15s cubic-bezier(0.55, 0.1, 0.35, 0.95) infinite;
    }

    @keyframes splash-rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes splash-run {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .splash-inner,
      .splash-bar i {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="splash" role="status" aria-label="正在加载">
    <div class="splash-inner">
      <img class="splash-mark" src="/favicon.svg" alt="" width="64" height="64" />
      <div class="splash-name">衡电云控</div>
      <div class="splash-en">BALANCLOUD</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
