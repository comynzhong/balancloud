name: balancloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: balan-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=100
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - balan-net

  redis:
    image: redis:7-alpine
    container_name: balan-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 96m
    logging: *default-logging
    networks:
      - balan-net

  emqx:
    image: emqx/emqx:5.8.6
    container_name: balan-emqx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ['CMD-SHELL', 'emqx ctl status >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 448m
    logging: *default-logging
    networks:
      - balan-net

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: balan-tdengine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - tdengine_data:/var/lib/taos
      - tdengine_log:/var/log/taos
    healthcheck:
      test: ['CMD-SHELL', 'taos -h 127.0.0.1 -s "SHOW DATABASES;" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - balan-net

  tdengine-init:
    image: tdengine/tdengine:3.3.6.0
    container_name: balan-tdengine-init
    depends_on:
      tdengine:
        condition: service_healthy
    volumes:
      - ./tdengine/init.sql:/init.sql:ro
    entrypoint: ['/bin/sh', '-c', 'taos -h tdengine -f /init.sql']
    restart: "no"
    logging: *default-logging
    networks:
      - balan-net

volumes:
  mysql_data:
  redis_data:
  emqx_data:
  emqx_log:
  tdengine_data:
  tdengine_log:

networks:
  balan-net:
    driver: bridge
